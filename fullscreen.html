<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Gallery</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="root.js"></script>
  <link rel="stylesheet" href="root.css">

  <style>
    body {
      margin: 0;
      background: black;
    }

    .fullscreen-popup {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    .popup-header {
      height: 90px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      color: white;
    }

    .swiper {
      width: 100%;
    }

    .fullscreenSwiper {
      flex: 1;
    }

    .fullscreenSwiper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .thumbSwiper {
      height: 110px;
      padding: 10px 40px 20px;
    }

    .thumbSwiper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
      border-radius: 6px;
    }

    .swiper-slide-thumb-active img {
      opacity: 1;
    }

    .swiper-button-prev,
    .swiper-button-next {
      color: white;
    }
  </style>
</head>

<body>

  <section class="fullscreen-popup">

    <div class="popup-header">
      <button class="back-btn" onclick="history.back()">
        <p>← Quay lại</p>
      </button>

      <a id="popupDownload" download>
        <button>
          <p>Tải về</p>
        </button>
      </a>
    </div>

    <div class="swiper fullscreenSwiper">
      <div class="swiper-wrapper"></div>
    </div>

    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>

    <div class="swiper thumbSwiper">
      <div class="swiper-wrapper"></div>
    </div>

  </section>

</body>

<script>

  const photos = JSON.parse(sessionStorage.getItem("photos")) || [];
  let currentIndex = Number(sessionStorage.getItem("photoIndex")) || 0;

  const downloadBtn = document.getElementById("popupDownload");
  const thumbWrapper = document.querySelector(".thumbSwiper .swiper-wrapper");


  // ---------------------------
  // tạo thumbnail
  // ---------------------------

  photos.forEach((src, index) => {

    const slide = document.createElement("div");
    slide.className = "swiper-slide";

    slide.innerHTML = `
        <img
            src="${src}"
            loading="lazy"
            decoding="async"
            data-index="${index}">
    `;

    thumbWrapper.appendChild(slide);

  });


  // ---------------------------
  // Fullscreen Swiper
  // ---------------------------

  const fullscreenSwiper = new Swiper(".fullscreenSwiper", {

    virtual: {
      slides: photos.map(src => `
            <div class="swiper-slide">
                <img
                    src="${src}"
                    loading="eager"
                    decoding="async">
            </div>
        `)
    },

    initialSlide: currentIndex,

    navigation: {
      nextEl: ".swiper-button-next",
      prevEl: ".swiper-button-prev"
    }

  });


  // ---------------------------
  // Thumbnail Swiper
  // ---------------------------

  const thumbSwiper = new Swiper(".thumbSwiper", {
    slidesPerView: "auto",
    spaceBetween: 12,
    freeMode: true,
    watchSlidesProgress: true

  });

  // ------------------------------------
  // Đồng bộ Download
  // ------------------------------------

  function updateDownload(index) {
    downloadBtn.href = photos[index];
    downloadBtn.download = photos[index].split("/").pop();
  }

  updateDownload(currentIndex);


  // ------------------------------------
  // Active Thumbnail
  // ------------------------------------

  function updateThumb(index) {

    document
      .querySelectorAll(".thumbSwiper .swiper-slide")
      .forEach(slide => {
        slide.classList.remove("swiper-slide-thumb-active");
      });

    const activeSlide =
      document.querySelector(
        `.thumbSwiper img[data-index="${index}"]`
      )?.parentElement;
    if (activeSlide) {
      activeSlide.classList.add("swiper-slide-thumb-active");
    }
    thumbSwiper.slideTo(index);

  }


  // ------------------------------------
  // Fullscreen đổi ảnh
  // ------------------------------------

  fullscreenSwiper.on("slideChange", () => {
    currentIndex = fullscreenSwiper.activeIndex;
    updateThumb(currentIndex);
    updateDownload(currentIndex);
  });


  // ------------------------------------
  // Thumbnail click
  // ------------------------------------

  document
    .querySelectorAll(".thumbSwiper img")
    .forEach(img => {
      img.addEventListener("click", () => {
        currentIndex = Number(img.dataset.index);
        fullscreenSwiper.slideTo(currentIndex);
        updateThumb(currentIndex);
        updateDownload(currentIndex);
      });
    });

  updateThumb(currentIndex);

</script>

</html>
