<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Gallery</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="root.js"></script>
  <link rel="stylesheet" href="root.css">

  <style>
    body {
      margin: 0;
      background: black;
    }

    .fullscreen-popup {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    .popup-header {
      height: 90px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      color: white;
    }

    .swiper {
      width: 100%;
    }

    .fullscreenSwiper {
      flex: 1;
    }

    .fullscreenSwiper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .thumbSwiper {
      height: 110px;
      padding: 10px 40px 20px;
    }

    .thumbSwiper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
      border-radius: 6px;
    }

    .swiper-slide-thumb-active img {
      opacity: 1;
    }

    .swiper-button-prev,
    .swiper-button-next {
      color: white;
    }
  </style>
</head>

<body>

  <section class="fullscreen-popup">

    <div class="popup-header">
      <button class="back-btn" onclick="history.back()">
        <p>← Quay lại</p>
      </button>

      <a id="popupDownload" download>
        <button>
          <p>Tải về</p>
        </button>
      </a>
    </div>

    <div class="swiper fullscreenSwiper">
      <div class="swiper-wrapper"></div>
    </div>

    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>

    <div class="swiper thumbSwiper">
      <div class="swiper-wrapper"></div>
    </div>

  </section>

</body>

<script>
  const mainWrapper = document.querySelector(".fullscreenSwiper .swiper-wrapper");
  const thumbWrapper = document.querySelector(".thumbSwiper .swiper-wrapper");

  const photos = JSON.parse(sessionStorage.getItem("photos")) || [];
  let photoIndex = Number(sessionStorage.getItem("photoIndex")) || 0;

  const RANGE = 20;
  let start = 0;

  function renderSlides(centerIndex) {

    mainWrapper.innerHTML = "";
    thumbWrapper.innerHTML = "";

    start = Math.max(0, centerIndex - Math.floor(RANGE / 2));

    if (start + RANGE > photos.length) {
      start = Math.max(0, photos.length - RANGE);
    }

    const end = Math.min(start + RANGE, photos.length);

    for (let i = start; i < end; i++) {

      const mainSlide = document.createElement("div");
      mainSlide.className = "swiper-slide";
      mainSlide.innerHTML =
        `<img src="${photos[i]}" loading="eager" decoding="async">`;

      mainWrapper.appendChild(mainSlide);

      const thumbSlide = document.createElement("div");
      thumbSlide.className = "swiper-slide";
      thumbSlide.innerHTML =
        `<img src="${photos[i]}" loading="lazy" decoding="async">`;

      thumbWrapper.appendChild(thumbSlide);
    }
  }

  renderSlides(photoIndex);

  const thumbSwiper = new Swiper(".thumbSwiper", {
    spaceBetween: 10,
    slidesPerView: "auto",
    freeMode: true,
    watchSlidesProgress: true,
  });

  const fullscreenSwiper = new Swiper(".fullscreenSwiper", {

    initialSlide: photoIndex - start,

    navigation: {
      nextEl: ".swiper-button-next",
      prevEl: ".swiper-button-prev",
    },

    thumbs: {
      swiper: thumbSwiper,
    }

  });

  fullscreenSwiper.slideTo(photoIndex - start, 0);
  thumbSwiper.slideTo(photoIndex - start, 0);

  fullscreenSwiper.on("slideChange", () => {

    const realIndex = start + fullscreenSwiper.activeIndex;

    if (
      realIndex < start + 5 ||
      realIndex > start + RANGE - 5
    ) {

      photoIndex = realIndex;

      renderSlides(photoIndex);

      fullscreenSwiper.removeAllSlides();
      thumbSwiper.removeAllSlides();

      const mainSlides = [...mainWrapper.children];
      const thumbSlides = [...thumbWrapper.children];

      fullscreenSwiper.appendSlide(mainSlides);
      thumbSwiper.appendSlide(thumbSlides);

      fullscreenSwiper.slideTo(photoIndex - start, 0);
      thumbSwiper.slideTo(photoIndex - start, 0);

    }

  });
</script>

</html>
