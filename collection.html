    <style>
        body {
            background-color: white;
        }

        .content {
            margin-top: 140px;
            margin-left: 12vw;
            margin-right: 6vw;

            display: flex;
            flex-direction: column;
            gap: 60px;
        }

        .content h2 {
            font-weight: var(--fontSemiBold);
        }

        /* collection --------------------------------------------- */
        .alb-grp {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 40px;
        }

        .alb-grp img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
        }

        .alb-grp .album {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .alb-grp .text {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .alb-grp .text h3 {
            font-size: var(--fontSizeBody);
            font-weight: var(--fontSizeBody);
        }

        .alb-grp .text p {
            color: var(--subColor4);
        }

        .alb-grp .blank {
            border: solid 1px var(--subColor4);
        }

        /* desktop: 1024px -> 1439px -------------------------------------------------- */
        @media screen and (max-width: 1439px) {}

        /* tablet: 768px -> 1023px  -------------------------------------------------- */
        @media (hover:none) and (max-width: 1023px) {
            .alb-grp {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* mobile: 360px -> 767px -------------------------------------------------- */
        @media screen and (max-width: 767px) {
            .content {
                margin: 100px 8vw 0;
                gap: 40px;
            }

            .alb-grp {
                grid-template-columns: repeat(2, 1fr);
                gap: 28px;
            }
        }
    </style>

    <link rel="stylesheet" href="root_desktop.css" media="screen and (max-width: 1439px)">
