    <style>
        body {
            background-color: white;
        }

        .content {
            margin-top: 140px;
            margin-left: 12vw;
            margin-right: 12vw;

            display: flex;
            flex-direction: column;
            gap: 60px;
        }

        .content h2 {
            font-weight: var(--fontSemiBold);
        }

        .content .tab-group {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .content .tab-name {
            display: flex;
            gap: 80px;
            border-bottom: solid 2px var(--subColor5);
        }

        .content .tab-name button {
            padding: 0;
            padding-bottom: 16px;
            font-weight: var(--fontSemiBold);
            color: var(--subColor3);
        }

        .content .tab-name button.active {
            border-bottom: solid 2px var(--mainColor1);
            color: var(--mainColor1);
            margin-bottom: -2px;
        }

        .content .tab-name button:hover {
            color: var(--mainColor1);
            cursor: pointer;
        }

        /* Time --------------------------------------------- */

        #Time h3 {
            font-weight: var(--fontRegular);
            font-size: var(--fontSizeBody);
        }

        #Time {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #Time .pics-group {
            padding: 0;
        }


        /* desktop: 1024px -> 1439px -------------------------------------------------- */
        @media screen and (max-width: 1439px) {}

        /* tablet: 768px -> 1023px  -------------------------------------------------- */
        @media (hover:none) and (max-width: 1023px) {
            .content {
                margin-right: 60px;
            }
        }

        /* mobile: 360px -> 767px -------------------------------------------------- */
        @media screen and (max-width: 767px) {

            .content {
                margin: 100px 8vw 0;
                gap: 40px;
            }
        }
    </style>

    <link rel="stylesheet" href="root_desktop.css" media="screen and (max-width: 1439px)">
    <link rel="stylesheet" href="root_tablet.css" media="screen and (max-width: 1023px)">
    <link rel="stylesheet" href="root_mobile.css" media="screen and (max-width: 767px)">

    function openTab(event, tabName) {

        // Ẩn tất cả tab
        const tabs = document.querySelectorAll(".tab-inside");
        tabs.forEach(tab => {
            tab.style.display = "none";
        });

        // Bỏ active của tất cả button
        const buttons = document.querySelectorAll(".tab-button");
        buttons.forEach(button => {
            button.classList.remove("active");
        });

        // Hiện tab được chọn
        document.getElementById(tabName).style.display = "flex";

        // Active button vừa click
        event.currentTarget.classList.add("active");
